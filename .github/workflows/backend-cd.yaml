name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
      - '.github/workflows/backend-cd.yaml'
  workflow_dispatch:

concurrency:
  group: backend-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: backend
  EKS_CLUSTER: cluster
  K8S_NAMESPACE: default
  PYTHON_VERSION: '3.10'

jobs:
  lint:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pipenv
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Lint
        run: pipenv run lint

  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pipenv
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Test
        run: pipenv run test

  build:
    if: github.ref == 'refs/heads/main'
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push SHA-tagged image
        working-directory: starter/backend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          image_uri="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build --tag "$image_uri" .
          docker push "$image_uri"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Install Kustomize
        run: |
          curl -fsSLo /tmp/kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo install /tmp/kustomize /usr/local/bin/kustomize

      - name: Deploy the SHA-tagged image
        working-directory: starter/backend/k8s
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          image_uri="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          kustomize edit set image backend="$image_uri"
          kustomize build | kubectl apply -f -

      - name: Wait for deployment rollout
        run: kubectl rollout status deployment/backend --namespace "$K8S_NAMESPACE" --timeout=180s

      - name: Verify backend deployment, pods, and service
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          expected_image="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          actual_image="$(kubectl get deployment backend --namespace "$K8S_NAMESPACE" --output=jsonpath='{.spec.template.spec.containers[0].image}')"
          if [[ "$actual_image" != "$expected_image" ]]; then
            echo "Backend image mismatch: expected $expected_image, got $actual_image" >&2
            exit 1
          fi
          kubectl wait --for=condition=Ready pod --selector=app=backend --namespace "$K8S_NAMESPACE" --timeout=180s
          kubectl get deployment backend --namespace "$K8S_NAMESPACE"
          kubectl get pods --selector=app=backend --namespace "$K8S_NAMESPACE" --output=wide
          kubectl get service backend --namespace "$K8S_NAMESPACE" --output=wide
          kubectl describe deployment backend --namespace "$K8S_NAMESPACE"

      - name: Verify backend movies API
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            backend_host="$(kubectl get service backend --namespace "$K8S_NAMESPACE" --output=jsonpath='{.status.loadBalancer.ingress[0].hostname}{.status.loadBalancer.ingress[0].ip}')"
            if [[ -n "$backend_host" ]]; then
              curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "http://$backend_host/movies" | jq -e '.movies | length > 0 and all(.[]; has("id") and has("title"))' >/dev/null
              echo "Backend /movies API returned movie records."
              exit 0
            fi
            echo "Waiting for backend LoadBalancer address ($attempt/30)."
            sleep 10
          done
          echo "Backend LoadBalancer address was not assigned within 5 minutes." >&2
          exit 1