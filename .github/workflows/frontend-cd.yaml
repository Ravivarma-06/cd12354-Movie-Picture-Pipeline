name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yaml'
  workflow_dispatch:

concurrency:
  group: frontend-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: frontend
  EKS_CLUSTER: cluster
  K8S_NAMESPACE: default
  BACKEND_SERVICE: backend
  NODE_VERSION_FILE: starter/frontend/.nvmrc

jobs:
  lint:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --watchAll=false
        env:
          CI: true

  build:
    if: github.ref == 'refs/heads/main'
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Resolve backend API URL
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if kubectl get service "$BACKEND_SERVICE" --namespace "$K8S_NAMESPACE" >/dev/null 2>&1; then
              backend_host="$(kubectl get service "$BACKEND_SERVICE" --namespace "$K8S_NAMESPACE" --output=jsonpath='{.status.loadBalancer.ingress[0].hostname}{.status.loadBalancer.ingress[0].ip}')"
              if [[ -n "$backend_host" ]]; then
                echo "REACT_APP_MOVIE_API_URL=http://$backend_host" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
            echo "Waiting for $BACKEND_SERVICE LoadBalancer address in $K8S_NAMESPACE ($attempt/60)."
            sleep 10
          done
          echo "Backend Service or LoadBalancer address is unavailable after 10 minutes." >&2
          kubectl describe service "$BACKEND_SERVICE" --namespace "$K8S_NAMESPACE" || true
          exit 1

      - name: Build and push SHA-tagged image
        working-directory: starter/frontend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          image_uri="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="$REACT_APP_MOVIE_API_URL" \
            --tag "$image_uri" \
            .
          docker push "$image_uri"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Install Kustomize
        run: |
          curl -fsSLo /tmp/kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo install /tmp/kustomize /usr/local/bin/kustomize

      - name: Deploy the SHA-tagged image
        working-directory: starter/frontend/k8s
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          image_uri="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          kustomize edit set image frontend="$image_uri"
          kustomize build | kubectl apply -f -

      - name: Wait for deployment rollout
        run: kubectl rollout status deployment/frontend --namespace "$K8S_NAMESPACE" --timeout=180s

      - name: Verify frontend deployment, pods, and service
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          expected_image="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          actual_image="$(kubectl get deployment frontend --namespace "$K8S_NAMESPACE" --output=jsonpath='{.spec.template.spec.containers[0].image}')"
          if [[ "$actual_image" != "$expected_image" ]]; then
            echo "Frontend image mismatch: expected $expected_image, got $actual_image" >&2
            exit 1
          fi
          kubectl wait --for=condition=Ready pod --selector=app=frontend --namespace "$K8S_NAMESPACE" --timeout=180s
          kubectl get deployment frontend --namespace "$K8S_NAMESPACE"
          kubectl get pods --selector=app=frontend --namespace "$K8S_NAMESPACE" --output=wide
          kubectl get service frontend --namespace "$K8S_NAMESPACE" --output=wide
          kubectl describe deployment frontend --namespace "$K8S_NAMESPACE"

      - name: Verify frontend LoadBalancer response
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if frontend_host="$(kubectl get service frontend --namespace "$K8S_NAMESPACE" --output=jsonpath='{.status.loadBalancer.ingress[0].hostname}{.status.loadBalancer.ingress[0].ip}')" && [[ -n "$frontend_host" ]]; then
              if html="$(curl --connect-timeout 5 --max-time 10 --fail --silent --show-error "http://$frontend_host/" 2>/dev/null)"; then
                if [[ "$html" == *'<div id="root"></div>'* ]]; then
                  echo "Frontend LoadBalancer is serving the app shell."
                  exit 0
                fi
              fi
            fi
            echo "Waiting for frontend LoadBalancer DNS/HTTP readiness ($attempt/20)."
            sleep 5
          done
          echo "Frontend LoadBalancer did not serve the app shell within 5 minutes." >&2
          exit 1